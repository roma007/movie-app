name: Release Tag Check

on:
  push:
    branches: [master]

permissions:
  contents: write
  actions: write

jobs:
  ensure-release-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Ensure release tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "Target tag: $TAG"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists, skip."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$TAG"
            if git push origin "$TAG"; then
              echo "created=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag push failed (likely raced with another run); re-checking..."
              git fetch --tags --force
              if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
                echo "Tag $TAG still missing after fetch" >&2
                exit 1
              fi
              echo "created=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_ENV"

      - name: Trigger release build on tag
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Dispatching build.yml on ref $tag"
          for i in 1 2 3 4 5; do
            if gh workflow run build.yml --ref "$tag"; then
              echo "Dispatch succeeded"
              exit 0
            fi
            echo "Retry $i after 5s..."
            sleep 5
          done
          echo "Dispatch failed after retries" >&2
          exit 1
