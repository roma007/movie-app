name: Build Release

on:
  push:
    branches: [master]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Verify app identifiers unchanged
        shell: bash
        run: |
          set -e
          # 升级 vs 重装由系统按「标识符+签名」判定，标识符一旦发布不可更改，否则新装不再覆盖、旧数据丢失。改包名构建直接失败。
          desktop_id=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').identifier")
          android_pkg=$(node -p "require('./apps/mobile/app.json').expo.android.package")
          ios_bundle=$(node -p "require('./apps/mobile/app.json').expo.ios.bundleIdentifier")
          [ "$desktop_id" = "com.movie.app.desktop" ] || { echo "IDENTIFIER CHANGED: desktop identifier=$desktop_id"; exit 1; }
          [ "$android_pkg" = "com.movie.app" ] || { echo "IDENTIFIER CHANGED: android package=$android_pkg"; exit 1; }
          [ "$ios_bundle" = "com.mengfeng.movieapp" ] || { echo "IDENTIFIER CHANGED: ios bundleIdentifier=$ios_bundle"; exit 1; }
          echo "Identifiers OK (desktop=$desktop_id, android=$android_pkg, ios=$ios_bundle)"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -e
          for i in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            echo "pnpm install failed (attempt $i/3), cleaning store and retrying..."
            rm -rf node_modules
            pnpm store prune || true
          done
          exit 1

      - name: Build Tauri app
        run: pnpm --filter @movie-app/desktop tauri build --target ${{ matrix.target }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Movie-App-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: warn

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Verify app identifiers unchanged
        shell: bash
        run: |
          set -e
          # 升级 vs 重装由系统按「标识符+签名」判定，标识符一旦发布不可更改，否则新装不再覆盖、旧数据丢失。改包名构建直接失败。
          desktop_id=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').identifier")
          android_pkg=$(node -p "require('./apps/mobile/app.json').expo.android.package")
          ios_bundle=$(node -p "require('./apps/mobile/app.json').expo.ios.bundleIdentifier")
          [ "$desktop_id" = "com.movie.app.desktop" ] || { echo "IDENTIFIER CHANGED: desktop identifier=$desktop_id"; exit 1; }
          [ "$android_pkg" = "com.movie.app" ] || { echo "IDENTIFIER CHANGED: android package=$android_pkg"; exit 1; }
          [ "$ios_bundle" = "com.mengfeng.movieapp" ] || { echo "IDENTIFIER CHANGED: ios bundleIdentifier=$ios_bundle"; exit 1; }
          echo "Identifiers OK (desktop=$desktop_id, android=$android_pkg, ios=$ios_bundle)"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -e
          for i in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            echo "pnpm install failed (attempt $i/3), cleaning store and retrying..."
            rm -rf node_modules
            pnpm store prune || true
          done
          exit 1

      - name: Initialize Android project
        run: |
          if [ ! -d "apps/desktop/src-tauri/gen/android" ]; then
            pnpm --filter @movie-app/desktop tauri android init --ci
          else
            echo "Android project already initialized"
          fi

      - name: Build Android APK
        run: pnpm --filter @movie-app/desktop tauri android build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Movie-App-Android
          path: |
            apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/desktop/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          name: Movie App ${{ github.ref_name }}
          body: "See the assets below to download and install."
          draft: false
          prerelease: false
